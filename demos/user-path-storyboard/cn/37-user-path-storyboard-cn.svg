<g id="_v1" data-kind="text" data-content-text="false" data-box="64,188,1906,32">

<text x="64" y="209.85" text-anchor="start" font-size="18" font-weight="400" fill="#6D6A63">用户：需要安排照护服务的照护者  ·  目标：在一次会话内找到下一步并完成预约</text>
</g>
<g id="_v2" data-kind="text" data-content-text="false" data-box="64,207,260,50">

<text x="64" y="237.2" text-anchor="start" font-size="16" font-weight="400" fill="#AC6046">前置条件 / Preconditions</text>
</g>
<g id="_v10" data-kind="text" data-content-text="false" data-box="64,400,280,52">

<text x="64" y="431.2" text-anchor="start" font-size="16" font-weight="400" fill="#AC6046">主路径 / Main path</text>
</g>
<g id="_v18" data-kind="text" data-content-text="false" data-box="64,665,300,50">

<text x="64" y="695.2" text-anchor="start" font-size="16" font-weight="400" fill="#AC6046">分支与异常 / Branches &amp; exceptions</text>
</g>
<g id="_v23" data-kind="text" data-content-text="false" data-box="64,851,1906,44">

<text x="64" y="877.875" text-anchor="start" font-size="15" font-weight="400" fill="#6D6A63">虚线与“拟议”只表示待验证路径；状态、分支和异常均来自输入，不从相邻位置推断。</text>
</g>
<g id="_v24" data-kind="text" data-content-text="false" data-box="64,34,1906,22">

<text x="64" y="49.55" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">37 / HIGH-FREQUENCY FORMS</text>
</g>
<g id="_v25" data-kind="text" data-content-text="false" data-box="64,69,1906,56">

<text x="64" y="108.7" text-anchor="start" font-size="36" font-weight="400" fill="#30302D">社区照护预约 · 用户路径故事板</text>
</g>
<g id="_v26" data-kind="text" data-content-text="false" data-box="64,130,1906,38">

<text x="64" y="154.525" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">把前置条件、可见状态、主路径、分支与异常放在同一条可审查路径上</text>
</g>
