<g id="_v3" data-kind="text" data-content-text="false" data-box="75.0,300,250,46">

<text x="75.0" y="317.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Handover information may be</text>
<text x="75.0" y="338.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">incomplete</text>
</g>
<g id="_v4" data-kind="text" data-content-text="false" data-box="75.0,354,250,46">

<text x="75.0" y="371.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Operator training may be</text>
<text x="75.0" y="392.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">uneven</text>
</g>
<g id="_v5" data-kind="text" data-content-text="false" data-box="100.0,628,260,36">

<text x="100.0" y="653.15" text-anchor="start" font-size="22" font-weight="400" fill="#AC6046">Equipment</text>
</g>
<g id="_v6" data-kind="text" data-content-text="false" data-box="75.0,510,250,32">

<text x="75.0" y="530.875" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Wear state may be abnormal</text>
</g>
<g id="_v7" data-kind="text" data-content-text="false" data-box="75.0,550,250,46">

<text x="75.0" y="567.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Signal quality may be</text>
<text x="75.0" y="588.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">unstable</text>
</g>
<g id="_v8" data-kind="text" data-content-text="false" data-box="473.33333333333326,236,260,36">

<text x="473.33333333333326" y="261.15" text-anchor="start" font-size="22" font-weight="400" fill="#67685E">Method</text>
</g>
<g id="_v9" data-kind="text" data-content-text="false" data-box="448.33333333333326,300,250,46">

<text x="448.33333333333326" y="317.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Troubleshooting path may be</text>
<text x="448.33333333333326" y="338.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">unclear</text>
</g>
<g id="_v10" data-kind="text" data-content-text="false" data-box="448.33333333333326,354,250,46">

<text x="448.33333333333326" y="371.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Parameter changes may be</text>
<text x="448.33333333333326" y="392.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">inconsistent</text>
</g>
<g id="_v11" data-kind="text" data-content-text="false" data-box="473.33333333333326,628,260,36">

<text x="473.33333333333326" y="653.15" text-anchor="start" font-size="22" font-weight="400" fill="#67685E">Environment</text>
</g>
<g id="_v12" data-kind="text" data-content-text="false" data-box="448.33333333333326,510,250,46">

<text x="448.33333333333326" y="527.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Temperature or humidity may</text>
<text x="448.33333333333326" y="548.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">vary</text>
</g>
<g id="_v13" data-kind="text" data-content-text="false" data-box="448.33333333333326,564,250,46">

<text x="448.33333333333326" y="581.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Interference sources may be</text>
<text x="448.33333333333326" y="602.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">present</text>
</g>
<g id="_v14" data-kind="text" data-content-text="false" data-box="846.6666666666666,236,260,36">

<text x="846.6666666666666" y="261.15" text-anchor="start" font-size="22" font-weight="400" fill="#8C7964">Materials</text>
</g>
<g id="_v15" data-kind="text" data-content-text="false" data-box="821.6666666666666,300,250,32">

<text x="821.6666666666666" y="320.875" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Batch differences may matter</text>
</g>
<g id="_v16" data-kind="text" data-content-text="false" data-box="821.6666666666666,340,250,46">

<text x="821.6666666666666" y="357.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Specification may not fit the</text>
<text x="821.6666666666666" y="378.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">use</text>
</g>
<g id="_v17" data-kind="text" data-content-text="false" data-box="846.6666666666666,628,260,36">

<text x="846.6666666666666" y="653.15" text-anchor="start" font-size="22" font-weight="400" fill="#8C7964">Measurement</text>
</g>
<g id="_v18" data-kind="text" data-content-text="false" data-box="821.6666666666666,510,250,46">

<text x="821.6666666666666" y="527.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Instrument status may be</text>
<text x="821.6666666666666" y="548.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">unverified</text>
</g>
<g id="_v19" data-kind="text" data-content-text="false" data-box="821.6666666666666,564,250,46">

<text x="821.6666666666666" y="581.75" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">• Measurement points may use</text>
<text x="821.6666666666666" y="602.0" text-anchor="start" font-size="15" font-weight="400" fill="#30302D">different definitions</text>
</g>
