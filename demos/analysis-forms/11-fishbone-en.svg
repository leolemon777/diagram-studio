<text x="1402.0" y="469.59999999999997" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">interruptions</text>
<text x="1402.0" y="493.29999999999995" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">Confirm frequency and</text>
<text x="1402.0" y="514.9" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">boundary before</text>
<text x="1402.0" y="536.5" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">prioritising</text>
