<main><small>DIAGRAM STUDIO / STRATEGY & DELIVERY</small><h1>精益画布 / Lean canvas</h1><p>精益画布围绕问题、客户、价值、方案和验证指标组织早期假说；不等同于商业模式画布。Each entry keeps a stable ID, evidence, and status.</p>

<script>for(const section of document.querySelectorAll('section')){const button=section.querySelector('.read'),obj=section.querySelector('object'),viewport=section.querySelector('.viewport');let reading=true;function size(){const svg=obj.contentDocument?.querySelector('svg');if(!svg)return;const v=svg.viewBox.baseVal;const width=reading?Math.max(v.width,viewport.clientWidth):viewport.clientWidth;obj.style.width=width+'px';obj.style.height=width*v.height/v.width+'px'}obj.addEventListener('load',size);button.onclick=()=>{reading=!reading;button.setAttribute('aria-pressed',String(reading));button.textContent=reading?'适合宽度 / Fit width':'清晰尺寸 / Readable size';size()};window.addEventListener('resize',size);size()}</script>
