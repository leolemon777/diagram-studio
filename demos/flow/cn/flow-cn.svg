<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">预约服务 · 从需求到确认</title>
<desc id="diagram-desc">先核对信息，再安排服务；信息不完整时返回补充</desc>
<rect width="100%" height="100%" fill="#F1EFEB"/>
<defs>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AC6046"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67685E"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C7964"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#554C46"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D6A63"/></marker>
<marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D8D3C8"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30302D"/></marker>
</defs>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<path d="M320,340.0 L360.0,340.0 L400,340.0" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M620,340.0 L660.0,340.0 L660.0,330.0 L700,330.0" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M920,330.0 L960.0,330.0 L960.0,340.0 L1000,340.0" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M810,390 L810,500" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M700,540 L640,540 L640,420 L620,420 L620,340" fill="none" stroke="#8C7964" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
<path d="M1220,340.0 L1260.0,340.0 L1300,340.0" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<g id="request" data-kind="pill" data-content-text="false" data-box="100,300,220,80">
<rect x="100" y="300" width="220" height="80" rx="40.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="210.0" y="336.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">提交需求</text>
<text x="210.0" y="360.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">目标 · 时间 · 联系方式</text>
</g>
<g id="check" data-kind="rect" data-content-text="false" data-box="400,300,220,80">
<rect x="400" y="300" width="220" height="80" rx="10" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="510.0" y="336.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">核对信息</text>
<text x="510.0" y="360.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">确认范围与可用条件</text>
</g>
<g id="complete" data-kind="diamond" data-content-text="false" data-box="700,270,220,120">
<polygon points="810.0,270 920,330.0 810.0,390 700,330.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="810.0" y="337.15" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">信息完整？</text>
</g>
<g id="add" data-kind="pill" data-content-text="false" data-box="700,500,220,80">
<rect x="700" y="500" width="220" height="80" rx="40.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="810.0" y="536.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">补充信息</text>
<text x="810.0" y="560.0500000000001" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">回答缺失问题</text>
</g>
<g id="schedule" data-kind="rect" data-content-text="false" data-box="1000,300,220,80">
<rect x="1000" y="300" width="220" height="80" rx="10" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="1110.0" y="336.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">安排服务</text>
<text x="1110.0" y="360.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">确认时间与负责人</text>
</g>
<g id="notify" data-kind="pill" data-content-text="false" data-box="1300,300,220,80">
<rect x="1300" y="300" width="220" height="80" rx="40.0" fill="#FEFDF9" stroke="#67685E" stroke-width="1.5"/>
<text x="1410.0" y="336.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">发送确认</text>
<text x="1410.0" y="360.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">通知结果与下一步</text>
</g>
<g id="_v7" data-kind="text" data-content-text="false" data-box="64,34,1472,22">

<text x="64" y="49.55" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">60 / FLOWCHART</text>
</g>
<g id="_v8" data-kind="text" data-content-text="false" data-box="64,69,1472,56">

<text x="64" y="108.7" text-anchor="start" font-size="36" font-weight="400" fill="#30302D">预约服务 · 从需求到确认</text>
</g>
<g id="_v9" data-kind="text" data-content-text="false" data-box="64,130,1472,38">

<text x="64" y="154.525" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">先核对信息，再安排服务；信息不完整时返回补充</text>
</g>
<g id="_v10" data-kind="rect" data-content-text="false" data-box="64,697,1472,1">
<rect x="64" y="697" width="1472" height="1" rx="0" fill="#D8D3C8" stroke="none" stroke-width="1.5"/>
</g>
<g id="_v11" data-kind="text" data-content-text="false" data-box="64,710,1472,36">

<text x="64" y="732.55" text-anchor="start" font-size="14" font-weight="400" fill="#6D6A63">跨行业流程示例 · 关系和条件来自输入；不自动推断业务规则</text>
</g>
<rect x="924.5" y="300.0" width="31.0" height="25" rx="4" fill="#F1EFEB"/>
<text x="940.0" y="317.0" font-size="15" text-anchor="middle" fill="#AC6046">是</text>
<rect x="822.5" y="433" width="31.0" height="25" rx="4" fill="#F1EFEB"/>
<text x="838" y="450" font-size="15" text-anchor="middle" fill="#AC6046">否</text>
<rect x="619.5" y="453" width="61.0" height="25" rx="4" fill="#F1EFEB"/>
<text x="650" y="470" font-size="15" text-anchor="middle" fill="#8C7964">补充后</text>
</g></svg>