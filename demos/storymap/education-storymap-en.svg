<text x="82" y="601.0000000000001" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">first lesson</text>
<text x="82" y="623.9500000000002" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">independently.</text>
