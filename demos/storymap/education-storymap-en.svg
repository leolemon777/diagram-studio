<text x="82" y="851.0500000000001" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">recovery information</text>
<text x="82" y="874.0000000000001" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63"> for a calmer first</text>
<text x="82" y="896.9500000000002" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">visit.</text>
</g>
