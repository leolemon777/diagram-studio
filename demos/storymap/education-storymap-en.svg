<text x="682.6666666666667" y="989.0" text-anchor="start" font-size="20" font-weight="600" fill="#30302D">Find cancellation terms</text>
</g>
<g id="storytext-S06-2" data-kind="text" data-content-text="true" data-box="682.6666666666667,1005,336.6666666666667,50" font-family="Heiti TC">

<text x="682.6666666666667" y="1024.05" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">Explain cancellation rules and support</text>
<text x="682.6666666666667" y="1047.0" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">contacts before payment.</text>
</g>
<g id="storytext-S06-3" data-kind="text" data-content-text="true" data-box="682.6666666666667,1062,336.6666666666667,23" font-family="Heiti TC">

<text x="682.6666666666667" y="1078.05" text-anchor="start" font-size="14" font-weight="400" fill="#6D6A63">Source: Proposed improvement H02</text>
</g>
<g id="_v48" data-kind="text" data-content-text="true" data-box="1067.3333333333335,715,336.6666666666667,26" font-family="Heiti TC">

<text x="1067.3333333333335" y="733.2" text-anchor="start" font-size="16" font-weight="400" fill="#6D6A63">— Not scheduled</text>
</g>
<g id="_v49" data-kind="text" data-content-text="true" data-box="64,1156,1372,25" font-family="Heiti TC">

<text x="64" y="1173.375" text-anchor="start" font-size="15" font-weight="400" fill="#6D6A63">Each story is assigned once. Confirm slice outcomes with the team. Dates, durations and priority scores are not inferred.</text>
</g>
<g id="_v50" data-kind="text" data-content-text="false" data-box="64,34,1372,23" font-family="Heiti TC">

<text x="64" y="50.05" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">EXPERIENCE / RELEASE SLICES</text>
</g>
<g id="_v51" data-kind="text" data-content-text="false" data-box="64,78,1372,53" font-family="Heiti TC">

<text x="64" y="116.2" text-anchor="start" font-size="36" font-weight="600" fill="#30302D">A complete first learning experience, one release at a time</text>
</g>
<g id="_v52" data-kind="text" data-content-text="false" data-box="64,139,1372,29" font-family="Heiti TC">

<text x="64" y="159.35" text-anchor="start" font-size="18" font-weight="400" fill="#6D6A63">Online education · User story map · Original simulated proposal</text>
</g>
<g id="_v53" data-kind="text" data-content-text="false" data-box="64,1227,1372,25" font-family="Heiti TC">

<text x="64" y="1244.375" text-anchor="start" font-size="15" font-weight="400" fill="#6D6A63">Simulated proposal · Input order is not a product commitment. Release slices are not calendar intervals.</text>
