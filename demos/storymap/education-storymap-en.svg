<text x="682.6666666666667" y="527.05" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">Show the course, start-time zone and a</text>
<text x="682.6666666666667" y="550.0" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">clear next step after success.</text>
</g>
<g id="storytext-S02-3" data-kind="text" data-content-text="true" data-box="682.6666666666667,565,336.6666666666667,23" font-family="Heiti TC">

