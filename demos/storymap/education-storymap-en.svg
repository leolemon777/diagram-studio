<text x="298.0" y="800.05" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">Offer a captioned preview and explain</text>
<text x="298.0" y="823.0" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">practice and support sessions.</text>
</g>
<g id="storytext-S04-3" data-kind="text" data-content-text="true" data-box="298.0,838,336.6666666666667,23" font-family="Heiti TC">

<text x="298.0" y="854.05" text-anchor="start" font-size="14" font-weight="400" fill="#6D6A63">Source: Simulated feedback E06</text>
</g>
<g id="storytext-S05-0" data-kind="text" data-content-text="true" data-box="682.6666666666667,713,336.6666666666667,23" font-family="Heiti TC">

<text x="682.6666666666667" y="729.05" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">S05</text>
</g>
<g id="storytext-S05-1" data-kind="text" data-content-text="true" data-box="682.6666666666667,743,336.6666666666667,31" font-family="Heiti TC">

<text x="682.6666666666667" y="765.0" text-anchor="start" font-size="20" font-weight="600" fill="#30302D">Recover from a missing email</text>
</g>
<g id="storytext-S05-2" data-kind="text" data-content-text="true" data-box="682.6666666666667,781,336.6666666666667,73" font-family="Heiti TC">

<text x="682.6666666666667" y="800.075" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">Resend confirmation and show</text>
<text x="682.6666666666667" y="823.0250000000001" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">enrollment status to prevent duplicate</text>
<text x="682.6666666666667" y="845.9750000000001" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">payment.</text>
</g>
<g id="storytext-S05-3" data-kind="text" data-content-text="true" data-box="682.6666666666667,861,336.6666666666667,23" font-family="Heiti TC">

<text x="682.6666666666667" y="877.05" text-anchor="start" font-size="14" font-weight="400" fill="#6D6A63">Source: Proposed improvement H01</text>
</g>
<g id="storytext-S06-0" data-kind="text" data-content-text="true" data-box="682.6666666666667,937,336.6666666666667,23" font-family="Heiti TC">

<text x="682.6666666666667" y="953.05" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">S06</text>
