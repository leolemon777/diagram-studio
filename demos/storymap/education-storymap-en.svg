<text x="1067.3333333333335" y="527.05" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">Enter from confirmation or email; give</text>
<text x="1067.3333333333335" y="550.0" text-anchor="start" font-size="17" font-weight="400" fill="#30302D">the entry button an accessible name.</text>
</g>
<g id="storytext-S03-3" data-kind="text" data-content-text="true" data-box="1067.3333333333335,565,336.6666666666667,23" font-family="Heiti TC">

