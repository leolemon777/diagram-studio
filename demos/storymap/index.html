<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram Studio · 从体验到交付</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1efeb;color:#30302d;font:16px/1.6 system-ui,sans-serif}header{padding:36px 5vw 24px;border-bottom:1px solid #d8d3c8}small{color:#91523f;letter-spacing:.09em}h1{font:500 clamp(30px,4vw,48px)/1.2 Georgia,'Songti SC',serif;margin:14px 0}p{max-width:800px;color:#6d6a63}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,a{font:inherit}button,select{border:1px solid #bdb7ad;background:#fefdf9;padding:8px 13px;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#30302d;color:#fff}a{color:#8c503d;text-underline-offset:4px}button:focus-visible,select:focus-visible,a:focus-visible,.viewport:focus-visible{outline:3px solid #8c503d;outline-offset:3px}.controls{position:sticky;top:0;z-index:2;padding:14px 5vw;background:#f1efeb;border-bottom:1px solid #d8d3c8}.viewport{overflow:auto;max-height:78vh;margin:24px 3vw;border:1px solid #d8d3c8;background:#fff}object{display:block;margin:auto}footer{padding:10px 5vw 44px}details{border-top:1px solid #d8d3c8;padding:18px 0}summary{cursor:pointer}.files{display:flex;gap:22px;flex-wrap:wrap}.status{font-size:13px;margin:8px 0 0} @media(max-width:600px){header{padding:28px 20px 20px}.controls{padding:12px 20px}.viewport{margin:15px 12px;max-height:70vh}nav{gap:8px}button,select{font-size:14px}footer{padding:12px 20px 30px}}
</style>
<header><small>DIAGRAM STUDIO / EXPERIENCE → RELEASE</small><h1 id="title"></h1><p id="intro"></p><a href="../chooser/index.html" id="back"></a></header>
<div class="controls"><nav aria-label="阅读与语言 / Reading and language"><select id="language" aria-label="内容语言 / Content language"><option value="zh">中文</option><option value="en">English</option></select><button id="read" type="button" aria-pressed="true"></button><button id="fit" type="button" aria-pressed="false"></button><a id="full"></a></nav><p class="status" id="quality" aria-live="polite"></p></div>
<div class="viewport" tabindex="0" role="region" aria-label="故事地图，可滚动 / Scrollable story map"><object type="image/svg+xml" aria-label="用户活动与交付切片 / Activities and release slices"></object></div>
<footer><details open><summary id="scopeTitle"></summary><p id="scope"></p><div class="files"><a id="svg" download>SVG</a><a id="drawio" download>draw.io</a><a id="model" download>JSON</a></div></details><p id="note"></p></footer>
<script src="browser_quality.js"></script>
<script>
const $=id=>document.getElementById(id), obj=document.querySelector('object'), frame=document.querySelector('.viewport');let mode='read';
const copy={zh:{title:'先走通体验，再划分交付。',intro:'一个原创课程报名案例：三项用户活动、两个交付切片。每条故事保留来源；未安排的位置保持为空。中英文使用对应的完整内容。',back:'返回选图向导 ↗',read:'清晰阅读',fit:'结构总览',full:'独立阅读页 ↗',scopeTitle:'下载范围 · 完整地图',scope:'包含 R1、R2 两个切片，3 项活动和 S01–S06 全部 6 条故事。下载不受当前滚动位置影响。SVG 用于查看，draw.io 可继续编辑，JSON 用于重新生成。',note:'模拟方案，待团队确认。交付切片不是时间比例，也不计算任务依赖或关键路径。',passed:'文字边界检查通过',failed:'文字边界需要复核',font:'最小显示字号',unavailable:'文字检查尚未完成',small:'总览文字偏小，请切换清晰阅读',readable:'字号达到当前检查阈值'},en:{title:'Complete the experience. Then slice delivery.',intro:'An original course-enrollment example: three user activities and two release slices. Each story retains its source; unscheduled cells stay empty. Both languages include complete diagram content.',back:'Back to diagram chooser ↗',read:'Readable size',fit:'Overview',full:'Standalone reader ↗',scopeTitle:'Download scope · Complete map',scope:'Includes R1 and R2, all 3 activities and all 6 stories S01–S06. Downloads include the whole map regardless of scroll position. View SVG, edit draw.io, or regenerate from JSON.',note:'Simulated proposal for team review. Release slices are not calendar intervals. Dependencies and critical paths are not calculated.',passed:'Text bounds passed',failed:'Review text bounds',font:'Smallest displayed text',unavailable:'Text check pending',small:'Overview text is small; switch to Readable size',readable:'Text size meets the current review threshold'}};
function lang(){return $('language').value}function stem(){return lang()==='zh'?'education-storymap':'education-storymap-en'}
async function size(){const doc=obj.contentDocument, svg=doc?.querySelector('svg');if(!svg)return;await doc.fonts.ready;const v=svg.viewBox.baseVal;const width=mode==='read'?Math.max(v.width,frame.clientWidth):frame.clientWidth;obj.style.width=width+'px';obj.style.height=width*v.height/v.width+'px';requestAnimationFrame(()=>{const q=diagramQuality(doc),w=copy[lang()];$('quality').dataset.report=JSON.stringify(q);$('quality').textContent=(q.status==='passed'?w.passed:w.failed)+' · '+w.font+': '+q.readability.minimum_content_font_px+'px · '+(q.readability.status==='review-required'?w.small:w.readable)});for(const id of ['read','fit'])$(id).setAttribute('aria-pressed',String(mode===id));}
function render(){const c=copy[lang()];document.documentElement.lang=lang()==='zh'?'zh-CN':'en';document.title='Diagram Studio · '+c.title;for(const key of ['title','intro','back','read','fit','full','scopeTitle','scope','note'])$(key).textContent=c[key];$('svg').href=stem()+'.svg';$('drawio').href=stem()+'.drawio';$('model').href=stem()+'.brief.json';$('full').href=stem()+'.html';$('quality').textContent=c.unavailable;delete $('quality').dataset.report;obj.data=stem()+'.svg';}
obj.addEventListener('load',size);$('language').onchange=render;for(const id of ['read','fit'])$(id).onclick=()=>{mode=id;size()};window.addEventListener('resize',size);render();
</script></html>
