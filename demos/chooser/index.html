'[data-focus-key]')].find(e=>e.dataset.focusKey===focusKey);target?.focus({preventScroll:true})}}
function updatePrompt(){const t=I[lang],d=groups.find(g=>g.id===group).types.find(x=>x.id===type),st=styles.find(x=>x[0]===style),content=$('content').value.trim(),audience=$('audience').value.trim(),size=$('size').selectedOptions[0]?.textContent||'',output=$('output').selectedOptions[0]?.textContent||'';let p;if(lang==='zh'){p=`使用 $diagram-studio，根据以下真实内容${d?'制作'+txt(d.name):'选择合适图型并制作图示'}。\n目的与读者：${audience||'请先根据内容判断，并标明推断'}\n内容：${content||'【在这里填写真实对象、关系、数据与单位】'}\n至少核对：${d?txt(d.need):'对象、关系、数值和单位'}。\n视觉方向：${st?st[1]+'（'+style+'）':'按内容和读者选择'}；保留原有关系、数值、单位和时间比例。\n画布：${size}。交付：${output}。\n先检查图型是否适合此问题；若更合适的形式存在，说明理由并给出选择。生成后实际检查文字、连线、图例和阅读顺序；缺少会改变语义的事实时标明假设并提问。`}else{p=`Use $diagram-studio to ${d?'create a '+txt(d.name):'choose an appropriate diagram form'} from the real content below.\nAudience and question: ${audience||'Infer from the content and label the inference'}\nContent: ${content||'[Add real objects, relationships, values, and units here]'}\nCheck at minimum: ${d?txt(d.need):'objects, relationships, values, and units'}.\nVisual direction: ${st?st[2]+' ('+style+')':'choose for the content and audience'}; preserve relationships, values, units, and time scale.\nCanvas: ${size}. Deliver: ${output}.\nCheck whether this diagram form fits the question; if another fits better, explain why and offer it. Inspect the actual output for text, links, legend, and reading order. Label assumptions and ask when missing facts would change the meaning.`}if(d?.scope)p+='\n'+(lang==='zh'?'实现边界：':'Implementation scope: ')+txt(d.scope);if(type==='storymap')p+='\n'+(lang==='zh'?'读取 references/story-map.md，使用 type: storymap；每条故事必须唯一引用一个活动和一个交付切片。':'Read references/story-map.en.md and use type: storymap; assign each story to exactly one activity and release slice.');if(group==='workshop')p+='\n'+(lang==='zh'?'读取 references/boardmix-study.md；保留观察→主题/阶段→拟议行动的来源引用；无真实投票不生成票数。':'Read references/boardmix-study.en.md; trace observations to themes/stages and proposed actions; do not inve
