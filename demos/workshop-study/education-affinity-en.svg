   <g id="text_1">
    <text style="font-weight: 500; font-size: 10px; font-family: 'Heiti TC'; text-anchor: start; fill: #30302d" x="58.5216" y="162.96512" transform="rotate(-0 58.5216 162.96512)">Course information · 2 items</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 182.000208)">• It is unclear what</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 193.201739)">prior knowledge</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 204.961739)">the course expects</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 217.280208)">  Source: Simulated interview E01</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 228.481739)">• The course page</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 240.241739)">has no practice</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 252.001739)">example</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(58.5216 264.320208)">  Source: Simulated interview E02</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 500; font-size: 10px; font-family: 'Heiti TC'; text-anchor: start; fill: #30302d" x="339.97824" y="162.96512" transform="rotate(-0 339.97824 162.96512)">After-enrolment guidance · 2 items</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 181.487677)">• After payment, the</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 193.201739)">next step is</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 205.696739)">unclear</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 217.280208)">  Source: Simulated interview E03</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 229.040208)">• The class link is</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 240.800208)">hard to find in</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 252.560208)">the email</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(339.97824 264.320208)">  Source: Simulated interview E04</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 500; font-size: 10px; font-family: 'Heiti TC'; text-anchor: start; fill: #30302d" x="621.43488" y="162.96512" transform="rotate(-0 621.43488 162.96512)">Participation conditions · 2 items</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 181.697677)">◆ A screen reader</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 193.201739)">cannot identify</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 205.520208)">the buttons</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 217.280208)">  Source: Simulated interview E05</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 228.527677)">• An evening Q&amp;A</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 240.241739)">slot would help</text>
    <text style="font-size: 8.4px; font-family: 'Heiti TC'; fill: #6d6a63" transform="translate(621.43488 252.572677)">  Source: Simulated interview E06</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'Heiti TC'; text-anchor: start; fill: #6d6a63" x="46.08" y="459.53856" transform="rotate(-0 46.08 459.53856)">◆ Minority feedback remains visible · Themes follow the original grouping</text>
