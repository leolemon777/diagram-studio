<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 850" width="1360" height="850" role="img" aria-labelledby="education-b-title" data-model-sha256="afae85c33be37bbe2cfbe266ae4cb636402675339e3aea6b76dee81cc9afd1cc" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><title id="education-b-title">同样一次学习，变化并不相同 · education-b</title><defs><marker id="education-b-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4 L1,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1360" height="850" fill="#FAF9F5" stroke="none" stroke-width="1"/><text x="56" y="51" font-size="16" fill="#5D696D" text-anchor="start" font-weight="400">EXPRESSION STUDY / EDUCATION-B</text><text x="56" y="112" font-size="34" fill="#242E32" text-anchor="start" font-weight="600">增幅刻度谱</text><text x="56" y="153" font-size="21" fill="#5D696D" text-anchor="start" font-weight="400">把变化排到最前面；右侧始终保留前后原值，避免只有“增长”没有起点。</text><polyline points="56,182 1304,182" fill="none" stroke="#D7DCD7" stroke-width="1.5"/><polyline points="56,778 1304,778" fill="none" stroke="#D7DCD7" stroke-width="1.5"/><text x="56" y="818" font-size="18" fill="#5D696D" text-anchor="start" font-weight="400">增幅 = 后测 − 前测，单位为分。按增幅排序；颜色与正负号共同区分方向，不作效果归因。</text><text x="1304" y="51" font-size="16" fill="#5D696D" text-anchor="end" font-weight="400">模拟数据</text><polyline points="338.0,244 338.0,693" fill="none" stroke="#D7DCD7" stroke-width="1"/><text x="338.0" y="728" font-size="18" fill="#5D696D" text-anchor="middle" font-weight="400">-20</text><polyline points="498.0,244 498.0,693" fill="none" stroke="#D7DCD7" stroke-width="1"/><text x="498.0" y="728" font-size="18" fill="#5D696D" text-anchor="middle" font-weight="400">-10</text><polyline points="658.0,244 658.0,693" fill="none" stroke="#242E32" stroke-width="1.5"/><text x="658.0" y="728" font-size="18" fill="#5D696D" text-anchor="middle" font-weight="400">0</text><polyli