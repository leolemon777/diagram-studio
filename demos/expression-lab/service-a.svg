<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 850" width="1360" height="850" role="img" aria-labelledby="service-a-title" data-model-sha256="ea5c2915d1dc6a4414639428a2e10f31016baf3498c8b02b48b66c3a31bde353" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><title id="service-a-title">服务如何向前，又在哪里返回？ · service-a</title><defs><marker id="service-a-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,4 L1,7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1360" height="850" fill="#FAF9F5" stroke="none" stroke-width="1"/><text x="56" y="51" font-size="16" fill="#5D696D" text-anchor="start" font-weight="400">EXPRESSION STUDY / SERVICE-A</text><text x="56" y="112" font-size="34" fill="#242E32" text-anchor="start" font-weight="600">主线与回流</text><text x="56" y="153" font-size="21" fill="#5D696D" text-anchor="start" font-weight="400">把常规处理放在上方，复杂问题与返工集中到下方；箭头始终给出方向。</text><polyline points="56,182 1304,182" fill="none" stroke="#D7DCD7" stroke-width="1.5"/><polyline points="56,778 1304,778" fill="none" stroke="#D7DCD7" stroke-width="1.5"/><text x="56" y="818" font-size="18" fill="#5D696D" text-anchor="start" font-weight="400">连线只表示处理关系，粗细不代表流量；“未解决”回到人工处理。间距不代表处理时长。</text><text x="1304" y="51" font-size="16" fill="#5D696D" text-anchor="end" font-weight="400">模拟数据</text><polyline points="149,342 329,342" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="234" y="313" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">登记</text><polyline points="375,342 619,342" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="495" y="313" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">常见问题</text><polyline points="352,365 352,588 619,588" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="458" y="563" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">复杂问题</text><polyline points="665,342 935,342" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="796" y="313" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">提交结果</text><polyline points="665,588 835,588 835,405 958,405 958,365" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="752" y="563" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">提交结果</text><polyline points="981,342 1197,342" fill="none" stroke="#286D65" stroke-width="2.2" marker-end="url(#service-a-arrow)"/><text x="1085" y="313" font-size="19" fill="#286D65" text-anchor="middle" font-weight="400">已解决</text><polyline points="978,354 1020,382 1020,682 642,682 642,611" fill="none" stroke="#A64732" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#service-a-arrow)"/><text x="829" y="717" font-size="19" fill="#A64732" text-anchor="middle" font-weight="400">未解决</text><circle cx="128" cy="342" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="128" y="349" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">A</text><text x="128" y="293" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">收到咨询</text><circle cx="352" cy="342" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="352" y="349" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">B</text><text x="352" y="293" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">内容分流</text><circle cx="642" cy="342" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="642" y="349" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">C</text><text x="642" y="293" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">自助解答</text><circle cx="642" cy="588" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="642" y="595" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">D</text><text x="642" y="539" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">人工处理</text><circle cx="958" cy="342" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="958" y="349" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">E</text><text x="958" y="293" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">用户确认</text><circle cx="1220" cy="342" r="21" fill="#FAF9F5" stroke="#242E32" stroke-width="1.7"/><text x="1220" y="349" font-size="18" fill="#242E32" text-anchor="middle" font-weight="400">F</text><text x="1220" y="293" font-size="24" fill="#242E32" text-anchor="middle" font-weight="500">关闭服务</text></svg>