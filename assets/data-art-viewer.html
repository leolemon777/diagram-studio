<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>body{margin:0;background:__BG__;color:__INK__;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}header,footer{padding:18px 5vw;display:flex;gap:20px;flex-wrap:wrap}header{border-bottom:1px solid __LINE__}button{background:none;color:inherit;border:1px solid __LINE__;padding:7px 15px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid __ACCENT__;outline-offset:3px}figure{margin:0;overflow:auto}svg{display:block;width:100%;height:auto;max-width:1600px;margin:auto}svg [data-record]{cursor:crosshair}svg.has-selection [data-record]{opacity:.2}svg.has-selection [data-record].selected{opacity:1}output{display:block;padding:12px 5vw;min-height:24px;color:__MUTED__;border-top:1px solid __LINE__}.data{overflow:auto;max-height:400px;margin:20px 5vw}table{border-collapse:collapse;font-size:13px;min-width:100%}td,th{padding:8px 16px;border-bottom:1px solid __LINE__;white-space:nowrap;text-align:left}footer{color:__MUTED__;font-size:12px}@media(max-width:700px){svg{min-width:1050px}}[hidden]{display:none!important}</style></head><body><header><button data-export="svg">下载 SVG</button><button data-export="drawio">下载 draw.io</button><button data-export="input">下载数据 JSON</button><button data-export="csv">下载 CSV</button><button id="toggle" aria-expanded="false">查看数据</button></header><figure>__SVG__</figure><output id="readout" role="status">指向数据标记查看数值，点击保留高亮。</output><div id="table" class="data" hidden>__TABLE__</div><footer>__SOURCE__ · 修改数据后请重新生成，以保持数值与图形比例一致。</footer><script type="application/json" id="embedded">__EMBEDDED__</script><script>const data=JSON.parse(document.getElementById('embedded').textContent),svg=document.querySelector('svg'),out=document.getElementById('readout');let locked=null;function show(el){svg.classList.toggle('has-selection',Boolean(el));svg.querySelectorAll('[data-record]').forEach(n=>n.classList.toggle('selected',el&&n.dataset.record===el.dataset.record));out.textContent=el?el.dataset.tip:'指向数据标记查看数值，点击保留高亮。'}svg.addEventListener('pointerover',e=>{const n=e.target.closest('[data-record]');if(!locked&&n)show(n)});svg.addEventListener('pointerleave',()=>{if(!locked)show(null)});svg.addEventListener('click',e=>{const n=e.target.closest('[data-record]');if(!n)return;locked=locked===n.dataset.record?null:n.dataset.record;show(locked?n:null)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){locked=null;show(null)}});document.getElementById('toggle').onclick=e=>{const table=document.getElementById('table');table.hidden=!table.hidden;e.target.setAttribute('aria-expanded',String(!table.hidden));e.target.textContent=table.hidden?'查看数据':'收起数据'};document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const k=b.dataset.export,value=k==='input'?JSON.stringify(data.input,null,2):data[k],ext=k==='input'?'input.json':k,url=URL.createObjectURL(new Blob([value],{type:k==='svg'?'image/svg+xml;charset=utf-8':'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=data.input.recipe+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});</script></body></html>
