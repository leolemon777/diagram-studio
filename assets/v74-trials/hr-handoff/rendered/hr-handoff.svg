<text x="88" y="431" text-anchor="start" font-size="20" font-weight="600" fill="#6D6A63">02  协调团队</text>
</g>
<g id="lane3" data-kind="panel" data-content-text="false" data-box="64,700,1472,190">
<rect x="64" y="700" width="1472" height="190" rx="10" fill="#FEFDF9" stroke="#D8D3C8" stroke-width="1.5"/>
<text x="88" y="729" text-anchor="start" font-size="20" font-weight="600" fill="#6D6A63">03  执行团队</text>
</g>
<path d="M365,299 L390,299 L390,390 L565,390 L565,460" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M685,502.0 L730.0,502.0 L730.0,499.0 L775,499.0" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M891.0,565 L891.0,662.5 L1223.0,662.5 L1223.0,760" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M891,433 L891,350 L565,350 L565,333" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
