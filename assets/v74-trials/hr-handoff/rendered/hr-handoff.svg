<path d="M1223,760 L1223,652 L1223,544" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M1100,502 L1035,502 L1035,592 L685,592" fill="none" stroke="#AC6046" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-accent)"/>
<path d="M1346,502 L1450,502 L1450,802 L1346,802" fill="none" stroke="#8C7964" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
<g id="submit" data-kind="pill" data-content-text="false" data-box="125,265,240,68">
<rect x="125" y="265" width="240" height="68" rx="34.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="245.0" y="295.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">提交请求</text>
<text x="245.0" y="319.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">说明目标与约束</text>
</g>
<g id="clarify" data-kind="pill" data-content-text="false" data-box="445,265,240,68">
<rect x="445" y="265" width="240" height="68" rx="34.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="565.0" y="295.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">补充信息</text>
<text x="565.0" y="319.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">回答关键问题</text>
</g>
<g id="triage" data-kind="rect" data-content-text="false" data-box="445,460,240,84">
<rect x="445" y="460" width="240" height="84" rx="10" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="565.0" y="498.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">确认范围</text>
<text x="565.0" y="522.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">明确优先级与交付物</text>
</g>
<g id="check" data-kind="diamond" data-content-text="false" data-box="775,433,232,132">
<polygon points="891.0,433 1007,499.0 891.0,565 775,499.0" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="891.0" y="506.15" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">信息完整？</text>
</g>
<g id="deliver" data-kind="rect" data-content-text="false" data-box="1100,760,246,84">
<rect x="1100" y="760" width="246" height="84" rx="10" fill="#FEFDF9" stroke="#AC6046" stroke-width="1.5"/>
<text x="1223.0" y="798.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">执行交付</text>
<text x="1223.0" y="822.0500000000001" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">提交可验收成果与复盘记录</text>
</g>
<g id="review" data-kind="rect" data-content-text="false" data-box="1100,460,246,84">
<rect x="1100" y="460" width="246" height="84" rx="10" fill="#FEFDF9" stroke="#67685E" stroke-width="1.5"/>
<text x="1223.0" y="498.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">验收反馈</text>
<text x="1223.0" y="522.05" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">协调团队确认质量</text>
</g>
<g id="close" data-kind="pill" data-content-text="false" data-box="445,550,240,84">
<rect x="445" y="550" width="240" height="84" rx="42.0" fill="#FEFDF9" stroke="#67685E" stroke-width="1.5"/>
<text x="565.0" y="588.35" text-anchor="middle" font-size="22" font-weight="600" fill="#30302D">确认完成</text>
<text x="565.0" y="612.0500000000001" text-anchor="middle" font-size="16" font-weight="400" fill="#6D6A63">记录结果与后续</text>
</g>
<g id="_v11" data-kind="text" data-content-text="false" data-box="64,34,1472,22">

<text x="64" y="49.55" text-anchor="start" font-size="14" font-weight="400" fill="#AC6046">59 / SWIMLANE FLOW</text>
</g>
<g id="_v12" data-kind="text" data-content-text="false" data-box="64,69,1472,56">

<text x="64" y="108.7" text-anchor="start" font-size="36" font-weight="400" fill="#30302D">服务请求 · 责任交接</text>
</g>
<g id="_v13" data-kind="text" data-content-text="false" data-box="64,130,1472,38">

<text x="64" y="154.525" text-anchor="start" font-size="17" font-weight="400" fill="#6D6A63">三条责任泳道；信息不完整回到申请人，交付后由协调团队验收</text>
</g>
