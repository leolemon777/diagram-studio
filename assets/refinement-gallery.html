<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram Studio · 精修验收</title>
<style>
:root{color-scheme:light;--paper:#f1efeb;--ink:#30302d;--muted:#6d6a63;--accent:#985238;--line:#d8d3c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,main,footer{max-width:1540px;margin:auto;padding:28px 4vw}header{border-bottom:1px solid var(--line)}.eyebrow{letter-spacing:.18em;font-size:11px;color:var(--accent)}.hero{display:flex;justify-content:space-between;gap:30px;align-items:start}h1{font:500 clamp(28px,4vw,52px)/1.3 "Songti SC",serif;margin:16px 0 12px}p{margin:8px 0;color:var(--muted);max-width:780px}button,select,a{font:inherit}button,select{border:1px solid var(--line);border-radius:4px;background:transparent;color:inherit;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.tools{display:flex;gap:8px;flex-wrap:wrap}.edition{font-size:12px;letter-spacing:.06em;color:var(--muted)}.status{margin:14px 0;font-size:12px;color:var(--muted)}.canvas{overflow:auto;background:#fefdf9;border:1px solid var(--line)}object{display:block;width:100%;height:auto}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}a{color:var(--accent);text-underline-offset:4px}aside{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}aside b{display:block;font-size:14px;font-weight:500;margin:4px 0}aside p{font-size:13px}footer{font-size:12px;color:var(--muted)}@media(max-width:650px){.hero{display:block}.hero select{margin-top:12px}aside{grid-template-columns:1fr;gap:8px}header,main,footer{padding:22px}.canvas{margin:0 -10px}h1{font-size:32px}}
</style>
<header><div class="eyebrow">DIAGRAM STUDIO / REFINEMENT STUDIES · 40</div><div class="hero"><div><h1 id="headline"></h1><p id="intro"></p></div><select id="language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></div><nav aria-label="Diagram type / 图型" id="types"></nav></header>
<main><div class="toolbar"><span class="edition" id="edition"></span><div class="tools"><button id="base"></button><button id="changed"></button><button id="dot"></button><button id="read"></button></div></div><div class="status" id="quality" aria-live="polite"></div><div class="canvas"><object id="diagram" type="image/svg+xml" aria-label="Diagram / 图示"></object></div><div class="links"><a id="reader"></a><a id="source"></a><a id="editable"></a><a id="receipt"></a></div><aside><div><span class="eyebrow">01 / CONTENT</span><b id="label1"></b><p id="note1"></p></div><div><span class="eyebrow">02 / COMPOSITION</span><b id="label2"></b><p id="note2"></p></div><div><span class="eyebrow">03 / DELIVERY</span><b id="label3"></b><p id="note3"></p></div></aside></main><footer id="footer"></footer>
<script src="browser_quality.js"></script><script>
const cases=__CASES__;
const copy={zh:{headline:'把清楚，做到精致。',intro:'五类常用图，共用完整数据与可编辑源。切换原始内容、增删测试与不同表达，检查图形能否经得起修改。',base:'精修示例',changed:'修改压力测试',dot:'另一表达：对照针',read:'清晰阅读',fit:'适合宽度',reader:'打开阅读与详页',source:'查看源数据',editable:'下载可编辑源',receipt:'查看交付记录',label1:'内容先通过',note1:'日期、数值、缺失、分支和依赖保持准确；所有演示内容均为模拟数据。',label2:'结构决定表达',note2:'主线与回流、职责分区、时间轨道、共用零点、真实日期，各有适合的图形语法。',label3:'检查有明确边界',note3:'本页检测实际文字边界、跨对象文字相交与当前字号。最终审美和原生编辑仍需单独查看。',footer:'本页展示已实现的五类精修范围；不代表全部图型、任意复杂度或全部编辑器已验收。',checking:'正在检查实际文字…',pass:'文字边界通过',issue:'文字需要复核',small:'字号偏小，可切换清晰阅读',font:'最小正文字号',blocked:'浏览器检查不可用，请通过本地 HTTP 服务打开。'},en:{headline:'Clarity, carefully composed.',intro:'Five everyday diagram forms with complete data and editable sources. Compare the original brief, content mutations and alternative expression.',base:'Refined example',changed:'Content stress test',dot:'Alternative: dot comparison',read:'Readable size',fit:'Fit width',reader:'Open reader & details',source:'Inspect source data',editable:'Download editable source',receipt:'Delivery record',label1:'Content comes first',note1:'Preserve dates, values, missing observations, branches and dependencies. All examples use simulated data.',label2:'Structure shapes the expression',note2:'Forward and return paths, responsibility layers, time tracks, a shared zero and real date spacing use distinct visual grammar.',label3:'Evidence has a scope',note3:'This page measures text bounds, cross-object text overlaps and displayed text size. Aesthetics and native editing require separate review.',footer:'These studies cover five implemented forms, not every diagram, complexity level or editor.',checking:'Checking rendered text…',pass:'Text bounds passed',issue:'Review text bounds',small:'Small text; switch to Readable size',font:'Minimum content text',blocked:'Browser check unavailable; open through a local HTTP server.'}};
let lang='zh',type='workflow',version='base',reading=false;
const $=id=>document.getElementById(id),obj=$('diagram');
function record(){return cases.find(c=>c.type===type&&c.version===version)}
function size(){const c=record(),width=reading?Math.max(c.width*12/c.minimum_font,document.querySelector('.canvas').clientWidth):document.querySelector('.canvas').clientWidth;obj.style.width=width+'px';obj.style.height=width*c.height/c.width+'px';requestAnimationFrame(check)}
async function check(){try{const doc=obj.contentDocument,expected=new URL(record().svg,location.href).href;if(!doc||doc.URL!==expected)return;await doc.fonts.ready;if(obj.contentDocument!==doc||new URL(record().svg,location.href).href!==expected)return;const r=diagramQuality(doc);r.file=record().svg;$('quality').dataset.report=JSON.stringify(r);const w=copy[lang];$('quality').textContent=(r.status==='passed'?w.pass:w.issue)+' · '+w.font+': '+(r.readability.minimum_content_font_px??'—')+'px'+(r.readability.status==='review-required'?' · '+w.small:'')}catch(_){$('quality').textContent=copy[lang].blocked}}
function draw(){const w=copy[lang],c=record();document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const id of ['headline','intro','base','changed','dot','reader','source','label1','note1','label2','note2','label3','note3','footer','receipt'])$(id).textContent=w[id];$('editable').textContent=w.editable;$('read').textContent=reading?w.fit:w.read;$('edition').textContent=c.name[lang==='zh'?0:1]+' / '+w[version];$('base').setAttribute('aria-pressed',version==='base');$('changed').setAttribute('aria-pressed',version==='changed');$('dot').hidden=type!=='comparison';$('dot').setAttribute('aria-pressed',version==='dot');$('reader').href=c.reader;$('source').href=c.source;$('editable').href=c.drawio;$('receipt').href=c.receipt;$('types').replaceChildren();for(const item of cases.filter(c=>c.version==='base')){const button=document.createElement('button');button.textContent=item.name[lang==='zh'?0:1];button.setAttribute('aria-pressed',item.type===type);button.onclick=()=>{type=item.type;version='base';reading=false;draw()};$('types').append(button)}if(obj.getAttribute('data')!==c.svg){delete $('quality').dataset.report;$('quality').textContent=w.checking;obj.data=c.svg}size()}
obj.addEventListener('load',check);$('base').onclick=()=>{version='base';draw()};$('changed').onclick=()=>{version='changed';draw()};$('dot').onclick=()=>{version='dot';draw()};$('read').onclick=()=>{reading=!reading;draw()};$('language').onchange=()=>{lang=$('language').value;draw()};window.addEventListener('resize',size);draw();
</script></html>
