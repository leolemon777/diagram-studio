<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画布与清晰度 · Apat</title><style>
:root{--bg:#f1efeb;--ink:#35372f;--muted:#76766a;--line:#d0cfc5;--accent:#52634e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC",sans-serif}header{padding:24px 4vw 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:25px;align-items:end}h1{font:34px/1.3 "Songti SC",serif;margin:5px 0 8px}header p{margin:0;color:var(--muted)}.eyebrow{font:11px Menlo,monospace;letter-spacing:1px}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;font-size:12px}main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px;padding:27px 4vw 40px}aside{border-right:1px solid var(--line);padding-right:27px}h2{font-size:15px;font-weight:500;margin:0 0 17px}label{display:block;font-size:12px;color:var(--muted);margin-top:16px}input,select,button{font:inherit;color:var(--ink)}input,select{width:100%;border:1px solid var(--line);background:transparent;padding:8px 9px;margin-top:5px;min-width:0}button{cursor:pointer;border:1px solid var(--line);background:none;padding:8px 14px}button:disabled{opacity:.5;cursor:wait}input:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;align-items:center;gap:8px;margin-top:13px}.check input{width:auto;margin:0}.check button{margin-left:auto;font-size:12px;padding:4px 10px}.primary{background:var(--ink);color:var(--bg);width:100%;margin-top:21px}.help{font-size:12px;color:var(--muted);margin-top:15px}.previewbar{display:flex;gap:20px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:17px}.previewbar h2{font:24px "Songti SC",serif;margin:0}.dims{font:12px Menlo,monospace;color:var(--muted)}.stage{min-height:350px;padding:22px;border:1px solid var(--line);background:#e5e3de;display:flex;justify-content:center;align-items:center}.paper{max-width:100%;line-height:0;box-shadow:0 7px 28px #34372f14}.paper svg{display:block;max-width:100%;width:auto;height:auto;max-height:76vh}.status{min-height:28px;margin:13px 0;color:var(--muted);font-size:12px}.status.error{color:#a04531}.downloads{display:flex;gap:10px;flex-wrap:wrap}.downloads a,.downloads button{font-size:12px;border:1px solid var(--line);text-decoration:none;padding:7px 12px;line-height:1.6}.bottom{margin-top:23px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.bottom p{margin:6px 0}[hidden]{display:none!important}@media(max-width:900px){main{grid-template-columns:220px minmax(0,1fr);gap:18px}aside{padding-right:18px}.stage{padding:12px}header{align-items:start;flex-direction:column}.paper svg{max-height:65vh}}@media(max-width:620px){main{display:block}aside{border-right:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}aside h2,.wide{grid-column:1/-1}section.preview{margin-top:28px}.stage{min-height:240px}.pair{gap:8px}h1{font-size:29px}}
</style></head><body><header><div><div class="eyebrow">APAT / CANVAS STUDIES</div><h1>同一张图，适合不同画面。</h1><p>先定比例和排版，再选择输出大小。</p></div><nav><a href="http://127.0.0.1:8766/style-atlas/index.html">结构图谱</a><a href="http://127.0.0.1:8766/data-art/index.html">数据图册</a></nav></header><main><aside><h2>画布设置</h2><label>图形来源<select id="kind"><option value="style">结构与风格图谱</option><option value="data">精致数据图形</option></select></label><label>图形<select id="name"></select></label><label>风格 / 配色<select id="variant"></select></label><label id="modeLabel">阅读方式<select id="mode"><option value="detail">细读 · 标记与旁注</option><option value="clear">快读 · 轮廓与比较</option></select></label><label>画布比例<select id="ratio" aria-label="画布比例"><option value="16:9">16:9 · 横屏</option><option value="9:16">9:16 · 竖屏</option><option value="1:1">1:1 · 方形</option><option value="4:5">4:5 · 竖版</option><option value="3:2">3:2 · 横版</option><option value="21:9">21:9 · 宽屏</option><option value="210:297">A4 · 竖版比例</option><option value="297:210">A4 · 横版比例</option><option value="custom">自定义比例</option></select><input id="ratioText" value="16:9" aria-label="自定义比例" placeholder="例如 7:10" hidden></label><label>输出尺寸<select id="resolution"><option value="1280">长边 1280 px</option><option value="1920" selected>长边 1920 px</option><option value="2560">长边 2560 px</option><option value="3840">长边 3840 px · 4K</option><option value="custom">自定义像素</option></select></label><div class="pair wide"><label>宽 / px<input id="width" type="number" min="128" max="16000" value="1920"></label><label>高 / px<input id="height" type="number" min="128" max="16000" value="1080"></label></div><div class="check wide"><label class="check" style="margin:0"><input id="lock" type="checkbox" checked>锁定比例</label><button id="swap">交换宽高</button></div><label>排版方式<select id="layout"><option value="adaptive">按比例重新排版</option><option value="fit">保留原布局 · 完整居中</option></select></label><label>打印密度 / DPI<input id="dpi" type="number" min="36" max="1200" value="144"></label><button id="render" class="primary wide">更新预览</button><p class="help wide">比例决定画面形状；像素决定位图清晰度。DPI 决定打印尺寸，不会凭空增加像素。</p></aside><section class="preview"><div class="previewbar"><h2 id="title">正在准备图形…</h2><span class="dims" id="dims"></span></div><div class="stage"><div class="paper" id="paper"></div></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="downloads" id="downloads"></div><div class="bottom"><p id="physical"></p><p>自适应模式：窄画布下流程与鱼骨纵向展开、架构分层；数据图旁注移到下方。尺寸变化保留关系和原始数据，所有样例均为模拟内容。</p><p>适用于当前 4 类结构图与 12 类数据配方。特别狭长的画布可使用完整居中，或按用途拆成多页。</p></div></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog,current,ticket=0,lockedRatio=16/9;
function options(){const data=$('#kind').value==='data';$('#name').innerHTML=Object.entries(data?catalog.recipes:catalog.forms).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');$('#variant').innerHTML=(data?catalog.themes:catalog.styles).map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');$('#modeLabel').hidden=!data;}
function ratioValue(){const text=$('#ratio').value==='custom'?$('#ratioText').value:$('#ratio').value;const a=text.replace('/',':').split(':').map(Number);if(a.length!==2||!a.every(v=>Number.isFinite(v)&&v>0))throw Error('请输入有效比例，例如 7:10。');return a[0]/a[1]}
function setRatio(){lockedRatio=ratioValue();const edge=$('#resolution').value==='custom'?Math.max(+$('#width').value,+$('#height').value):+$('#resolution').value;$('#width').value=Math.round(lockedRatio>=1?edge:edge*lockedRatio);$('#height').value=Math.round(lockedRatio>=1?edge/lockedRatio:edge);}
function payload(){return {kind:$('#kind').value,name:$('#name').value,variant:$('#variant').value,mode:$('#mode').value,width:+$('#width').value,height:+$('#height').value,dpi:+$('#dpi').value,layout:$('#layout').value}}
function status(text,error=false){$('#status').textContent=text;$('#status').className='status'+(error?' error':'')}
async function request(endpoint,body){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'生成失败');return d}
function syncSize(input){lockedRatio=input.width/input.height;const match=[...$('#ratio').options].find(o=>o.value!=='custom'&&Math.abs(ratioOf(o.value)-lockedRatio)<1e-7);$('#ratio').value=match?match.value:'custom';$('#ratioText').hidden=Boolean(match);$('#ratioText').value=input.width+':'+input.height;const edge=String(Math.max(input.width,input.height));$('#resolution').value=[...$('#resolution').options].some(o=>o.value===edge)?edge:'custom'}
function ratioOf(text){const [a,b]=text.split(':').map(Number);return a/b}
async function preview(){const id=++ticket,input=payload();syncSize(input);$('#render').disabled=true;$('#downloads').replaceChildren();current=null;status('正在按画布重新排版…');try{const d=await request('/api/preview',input);const svg=await fetch(d.files.svg).then(r=>r.text());if(id!==ticket)return;current={...d,request:input};$('#paper').innerHTML=svg;$('#title').textContent=d.title;$('#dims').textContent=`${d.canvas.width} × ${d.canvas.height} px · ${d.canvas.ratio}`;$('#physical').textContent=`${d.canvas.dpi} DPI 下打印尺寸约 ${d.canvas.physical_mm[0]} × ${d.canvas.physical_mm[1]} mm。SVG 与 PDF 保留矢量。`;$('#downloads').innerHTML=[['svg','SVG'],['drawio','draw.io'],['input.json','原始数据'],['canvas.json','尺寸参数']].map(([e,n])=>`<a href="${d.files[e]}" download>${n}</a>`).join('')+`<a href="${d.files.svg}" target="_blank">原尺寸查看 ↗</a>`+'<button data-export="png">导出 PNG</button><button data-export="pdf">导出 PDF</button><a id="editor" target="_blank" rel="noreferrer">编辑图形 ↗</a>';const xml=await fetch(d.files.drawio).then(r=>r.text());if(id!==ticket)return;$('#editor').href='https://app.diagrams.net/?splash=0&libs=general&lang=zh&grid=0&drafts=0#create='+encodeURIComponent(JSON.stringify({type:'xml',data:xml}));location.hash=new URLSearchParams(current.request).toString();status('预览已更新。下载会使用上方标明的实际像素尺寸。');}catch(e){if(id===ticket)status(e.message,true)}finally{if(id===ticket)$('#render').disabled=false}}
$('#kind').onchange=()=>{options();preview()};['name','variant','mode','layout'].forEach(id=>$('#'+id).onchange=preview);$('#ratio').onchange=()=>{try{$('#ratioText').hidden=$('#ratio').value!=='custom';setRatio();preview()}catch(e){status(e.message,true)}};$('#ratioText').onchange=()=>{try{setRatio();preview()}catch(e){status(e.message,true)}};$('#resolution').onchange=()=>{if($('#resolution').value!=='custom'){try{setRatio();preview()}catch(e){status(e.message,true)}}};['width','height'].forEach(id=>$('#'+id).onchange=()=>{if($('#lock').checked){$('#'+(id==='width'?'height':'width')).value=Math.round(id==='width'?+$('#width').value/lockedRatio:+$('#height').value*lockedRatio)}else lockedRatio=+$('#width').value/+$('#height').value;$('#resolution').value='custom';$('#ratio').value='custom';$('#ratioText').hidden=false;$('#ratioText').value=$('#width').value+':'+$('#height').value;preview()});$('#swap').onclick=()=>{const w=$('#width').value;$('#width').value=$('#height').value;$('#height').value=w;lockedRatio=1/lockedRatio;$('#ratio').value='custom';$('#ratioText').hidden=false;$('#ratioText').value=$('#width').value+':'+$('#height').value;preview()};$('#render').onclick=preview;$('#dpi').onchange=preview;
$('#downloads').onclick=async e=>{const b=e.target.closest('[data-export]');if(!b||!current)return;const snapshot=current,ext=b.dataset.export;b.disabled=true;status('正在生成 '+ext.toUpperCase()+'…');try{const d=await request('/api/export',snapshot.request),a=document.createElement('a');a.href=d.files[ext];a.download=snapshot.request.name+'.'+ext;a.click();if(current===snapshot)status(ext.toUpperCase()+' 已生成，尺寸 '+d.canvas.width+' × '+d.canvas.height+' px。')}catch(err){status(err.message,true)}finally{b.disabled=false}};
fetch('/api/catalog').then(r=>r.json()).then(d=>{catalog=d;const q=new URLSearchParams(location.hash.slice(1));$('#kind').value=q.get('kind')==='data'?'data':'style';options();for(const k of ['name','variant','mode','width','height','dpi','layout'])if(q.has(k)){$('#'+k).value=q.get(k)}if(!q.has('name'))$('#name').value=$('#kind').value==='data'?'barcode':'workflow';if(!q.has('variant'))$('#variant').value=$('#kind').value==='data'?'warm':'ledger';if(q.has('width')){$('#resolution').value='custom';$('#ratio').value='custom';$('#ratioText').hidden=false;$('#ratioText').value=$('#width').value+':'+$('#height').value;lockedRatio=+$('#width').value/+$('#height').value}preview()}).catch(e=>status(e.message,true));
</script></body></html>
